version: '3'
tasks:
  install:
    cmds: [uv sync --locked --all-extras]
  format:
    cmds: [uv run ruff format .]
  test:
    cmds: [uv run pytest --cov=wftnp --cov-report=term-missing]
  check:
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run ty check src
      - task: test
  build:
    cmds: [uv build]
